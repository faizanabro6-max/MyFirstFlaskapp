{% extends "base.html" %}

{% block content %}

<h1>Edit Post</h1>

<form method="POST">

    <label>Title:</label>
    <input type="text" name="title" value="{{ post.title }}">

    <br><br>

    <label>Content:</label>
    <textarea name="content">{{ post.content }}</textarea>

    <br><br>

    <button type="submit">Update Post</button>

</form>

{% endblock %}
