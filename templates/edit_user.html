{% extends "base.html" %}

{% block content %}

<h1>Edit User</h1>

<form method="POST">

    <label>Username:</label>
    <input type="text" name="username" value="{{ user.username }}">

    <br><br>

    <label>Email:</label>
    <input type="email" name="email" value="{{ user.email }}">

    <br><br>

    <button type="submit">Update User</button>

</form>

{% endblock %}
